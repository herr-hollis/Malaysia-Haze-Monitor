# Save as .github/workflows/collect.yml in a GitHub repo (with collect.py at the repo root).
# Runs every hour at minute 7, appends new DOE readings to data/api_hourly.csv and commits them.
name: collect-doe-api

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect DOE API
        run: python collect.py
      - name: Collect FIRMS hotspots
        run: python hotspots.py
        env:
          FIRMS_KEY: ${{ secrets.FIRMS_KEY }}
        continue-on-error: true
      - name: Build forecast
        run: python forecast.py
        continue-on-error: true
      - name: Commit data
        run: |
          git config user.name "haze-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data $(date -u +%FT%TZ)"
          git push
